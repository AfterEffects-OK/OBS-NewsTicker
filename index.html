<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS ニュースティッカー 設定パネル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-300">
                    OBS ニュースティッカー 設定パネル
                </h1>
                <p class="text-sm text-slate-400 mt-1">
                    OBSのブラウザソースには、下記の専用URL（背景完全透過）を設定してください。
                </p>
            </div>
            <div>
                <a id="obsUrlLink" href="#" target="_blank" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-lg transition-colors shadow flex items-center gap-2 text-white">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    OBS用プレビュー画面を別タブで確認
                </a>
            </div>
        </div>

        <!-- OBS Source URL Info Box -->
        <div class="bg-slate-800/90 border border-emerald-500/40 p-4 rounded-2xl shadow-xl space-y-2">
            <div class="text-xs font-bold text-emerald-300 flex items-center gap-2">
                <i data-lucide="link" class="w-4 h-4"></i> OBS ブラウザソース用 URL (?obs=1)
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="obsUrlInput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 font-mono select-all" value="読み込み中...">
                <button id="copyUrlBtn" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg transition text-white shrink-0">
                    コピー
                </button>
            </div>
        </div>

        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Status & Info -->
            <div class="space-y-6 lg:col-span-1">
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md">
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-indigo-300">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i> GASデータ連携ステータス
                    </h2>
                    <button id="reloadGasBtn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-lg transition text-white shadow flex items-center justify-center gap-2">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i> スプレッドシートから再読み込み
                    </button>
                    
                    <div class="mt-4">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">取得したCSVデータ (確認用):</label>
                        <textarea id="csvTextArea" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 font-mono" placeholder="読み込み中..."></textarea>
                    </div>
                </div>

                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md space-y-4">
                    <h2 class="text-lg font-bold text-indigo-300 flex items-center gap-2">
                        <i data-lucide="filter" class="w-5 h-5"></i> 配信情報
                    </h2>
                    <div class="text-xs text-slate-300 space-y-2">
                        <div class="flex justify-between"><span>総レコード数:</span> <span id="statTotal" class="font-bold text-slate-200">0</span>行</div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Data Preview Table -->
            <div class="space-y-6 lg:col-span-2">
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md">
                    <h2 class="text-lg font-bold mb-3 text-indigo-300 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i data-lucide="list" class="w-5 h-5"></i> スプレッドシートデータ一覧 (<span id="tableRowCount">0</span>行)</span>
                    </h2>
                    <div class="max-h-[500px] overflow-y-auto overflow-x-auto border border-slate-700 rounded-lg">
                        <table id="previewTable" class="w-full text-left text-xs text-slate-300 whitespace-nowrap">
                            <thead id="previewTableHead" class="bg-slate-900/90 text-slate-400 sticky top-0 border-b border-slate-700 z-10"></thead>
                            <tbody id="previewTableBody" class="divide-y divide-slate-700/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdaMfu4w0GvrnNBEDc-eDu05kExD_ZafMHtkvj92WleRoipmDVU832topbMKAl5ErVkQ/exec';
        
        // OBS用プレビューURL（?obs=1 を付与して obs.html を呼び出す）
        const obsUrl = 'https://aftereffects-ok.github.io/OBS-NewsTicker/obs.html';
        
        document.getElementById('obsUrlInput').value = obsUrl;
        document.getElementById('obsUrlLink').href = obsUrl;

        document.getElementById('copyUrlBtn').addEventListener('click', () => {
            const input = document.getElementById('obsUrlInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('OBS用URLをコピーしました！');
        });

        let rawCSVHeaders = [];
        let allRecords = [];

        function parseCSV(text) {
            if (!text || !text.trim()) return [];
            const lines = [];
            let currentRow = [];
            let currentField = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (insideQuote && nextChar === '"') { currentField += '"'; i++; }
                    else { insideQuote = !insideQuote; }
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(currentField.trim()); currentField = '';
                } else if ((char === '\r' || char === '\n') && !insideQuote) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField.trim());
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) lines.push(currentRow);
                    currentRow = []; currentField = '';
                } else { currentField += char; }
            }
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (lines.length === 0 || currentRow.length > 1) lines.push(currentRow);
            }
            if (lines.length < 2) return [];

            rawCSVHeaders = lines[0];
            const records = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i];
                if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;
                const record = {};
                rawCSVHeaders.forEach((h, idx) => { record[h] = row[idx] !== undefined ? row[idx] : ''; });
                records.push(record);
            }
            return records;
        }

        function updatePreviewTable() {
            const head = document.getElementById('previewTableHead');
            const body = document.getElementById('previewTableBody');
            head.innerHTML = '';
            body.innerHTML = '';
            document.getElementById('tableRowCount').textContent = allRecords.length;
            document.getElementById('statTotal').textContent = allRecords.length;

            if (allRecords.length === 0) return;

            const trHead = document.createElement('tr');
            rawCSVHeaders.forEach(h => {
                const th = document.createElement('th');
                th.className = 'p-2 border-r border-slate-700/50';
                th.textContent = h;
                trHead.appendChild(th);
            });
            head.appendChild(trHead);

            allRecords.forEach((record, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-slate-800/40' : 'bg-slate-900/40';
                rawCSVHeaders.forEach(h => {
                    const td = document.createElement('td');
                    td.className = 'p-2 border-r border-slate-700/50 max-w-xs truncate';
                    td.textContent = record[h] !== undefined ? record[h] : '';
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        function fetchFromGAS() {
            fetch(GAS_WEB_APP_URL)
                .then(res => res.text())
                .then(csv => {
                    document.getElementById('csvTextArea').value = csv;
                    allRecords = parseCSV(csv);
                    updatePreviewTable();
                })
                .catch(err => {
                    console.error(err);
                });
        }

        window.onload = function() {
            lucide.createIcons();
            fetchFromGAS();
            document.getElementById('reloadGasBtn').addEventListener('click', fetchFromGAS);
        };
    </script>
</body>
</html>
