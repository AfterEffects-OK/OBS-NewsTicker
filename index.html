<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS ニュースティッカー 設定パネル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-300">
                    OBS ニュースティッカー 設定パネル
                </h1>
                <p class="text-sm text-slate-400 mt-1">
                    OBSのブラウザソースには、下記の専用URL（背景完全透過）を設定してください。
                </p>
            </div>
            <div>
                <a id="obsUrlLink" href="#" target="_blank" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-lg transition-colors shadow flex items-center gap-2 text-white">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    OBS用プレビュー画面を別タブで確認
                </a>
            </div>
        </div>

        <!-- OBS Source URL Info Box -->
        <div class="bg-slate-800/90 border border-emerald-500/40 p-4 rounded-2xl shadow-xl space-y-2">
            <div class="text-xs font-bold text-emerald-300 flex items-center gap-2">
                <i data-lucide="link" class="w-4 h-4"></i> OBS ブラウザソース用 URL (obs.html)
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="obsUrlInput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 font-mono select-all" value="読み込み中...">
                <button id="copyUrlBtn" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg transition text-white shrink-0">
                    コピー
                </button>
            </div>
        </div>

        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Status & Filters -->
            <div class="space-y-6 lg:col-span-1">
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md">
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-indigo-300">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i> GASデータ連携ステータス
                    </h2>
                    <button id="reloadGasBtn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-lg transition text-white shadow flex items-center justify-center gap-2">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i> スプレッドシートから再読み込み
                    </button>
                    
                    <div class="mt-4">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">CSVデータ読み込み:</label>
                        <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-lg p-4 text-center cursor-pointer transition bg-slate-900/50 mb-3">
                            <p class="text-xs text-slate-300">CSVファイルをドラッグ＆ドロップ</p>
                            <p class="text-[10px] text-slate-500 mt-1">またはクリックしてファイル選択</p>
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                        </div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">または CSVテキストを直接貼り付け:</label>
                        <textarea id="csvTextArea" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 font-mono" placeholder="読み込み中..."></textarea>
                        <button id="applyCsvTextBtn" class="w-full mt-2 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-lg transition text-white">テキストを反映</button>
                    </div>
                </div>

                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md space-y-4">
                    <h2 class="text-lg font-bold text-indigo-300 flex items-center gap-2">
                        <i data-lucide="filter" class="w-5 h-5"></i> 配信フィルタ設定
                    </h2>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">配信モードで絞り込み</label>
                        <select id="modeFilter" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                            <option value="ALL">すべての配信モード</option>
                        </select>
                    </div>
                    <div class="pt-2 border-t border-slate-700/60">
                        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="checkbox" id="weekdayFilterCheck" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-900 border-slate-700">
                            <span>現在の曜日（<span id="currentWeekdayLabel" class="text-amber-400 font-bold"></span>）で自動絞り込み</span>
                        </label>
                    </div>
                    <div class="pt-2 border-t border-slate-700/60 text-xs text-slate-400 space-y-1">
                        <div class="flex justify-between"><span>総レコード数:</span> <span id="statTotal" class="font-bold text-slate-200">0</span></div>
                        <div class="flex justify-between"><span>表示対象数:</span> <span id="statActive" class="font-bold text-indigo-400">0</span></div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Settings & Data Preview Table -->
            <div class="space-y-6 lg:col-span-2">
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md space-y-4">
                    <h2 class="text-lg font-bold text-indigo-300 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-5 h-5"></i> ティッカー枠 & 共通設定
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">枠の横幅 (px)</label>
                            <input type="number" id="tickerWidthInput" value="800" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 font-bold text-amber-400">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">枠の高さ (px)</label>
                            <input type="number" id="tickerHeightInput" value="60" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 font-bold text-amber-400">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">表示時間（秒/件）</label>
                            <input type="number" id="displayDuration" value="10" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 font-bold text-amber-400">
                            <span class="text-[10px] text-slate-500">※CSV個別の「表示時間」優先</span>
                        </div>
                        <div class="sm:col-span-2 lg:col-span-3">
                            <label class="block text-xs text-slate-400 mb-1">フォントファミリー</label>
                            <select id="fontFamilySelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                                <option value="'Noto Sans JP', sans-serif" selected>Noto Sans JP (標準)</option>
                                <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded (丸ゴシック)</option>
                                <option value="sans-serif">ゴシック体 (標準)</option>
                                <option value="serif">明朝体</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md space-y-4">
                    <h3 class="text-md font-bold text-amber-400 flex items-center gap-2 border-b border-slate-700 pb-2">
                        <i data-lucide="palette" class="w-4 h-4"></i> デザイン & アイコン設定
                    </h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1">アニメーション</label>
                            <select id="cfg_transition" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200">
                                <option value="csv" selected>CSVの指定に従う</option>
                                <option value="swipe-down">下方向スライド</option>
                                <option value="swipe-up">上方向スライド</option>
                                <option value="swipe-left">左方向スライド</option>
                                <option value="swipe-right">右方向スライド</option>
                                <option value="fade">フェード</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">件名 (上部) 文字サイズ</label>
                            <input type="number" id="cfg_headerFontSize" value="12" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">本文 (下部) 文字サイズ</label>
                            <input type="number" id="cfg_mainFontSize" value="28" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200 font-bold text-amber-400">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">本文 (下部) フォントの太さ</label>
                            <select id="cfg_mainFontWeight" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200 font-bold">
                                <option value="400">標準 (400)</option>
                                <option value="500" selected>中太 (500)</option>
                                <option value="700">太字 (700)</option>
                                <option value="800">極太 (800)</option>
                                <option value="900">超極太 (900)</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-2">
                            <label class="block text-slate-400 mb-1">デフォルト アイコン画像URL (または絵文字)</label>
                            <input type="text" id="cfg_iconInput" value="📢" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">アイコン領域幅 (px)</label>
                            <input type="number" id="cfg_iconWidth" value="70" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">アイコン背景色</label>
                            <input type="color" id="cfg_iconBgColor" value="#3b82f6" class="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer p-0.5">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">件名 (上部) 文字色</label>
                            <input type="color" id="cfg_headerTextColor" value="#93c5fd" class="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer p-0.5">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">本文 (下部) 文字色</label>
                            <input type="color" id="cfg_mainTextColor" value="#ffffff" class="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer p-0.5">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">枠の背景色</label>
                            <input type="color" id="cfg_bgColor" value="#1e293b" class="w-full h-8 bg-slate-900 border border-slate-700 rounded cursor-pointer p-0.5">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-slate-400 mb-1">
                                <span>背景不透明度</span>
                                <span id="cfg_bgOpacityVal">90%</span>
                            </div>
                            <input type="range" id="cfg_bgOpacity" min="0" max="100" value="90" class="w-full accent-indigo-500">
                        </div>
                    </div>
                    <div class="pt-2 border-t border-slate-700/60">
                        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="checkbox" id="cfg_autoEmoji" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-900 border-slate-700">
                            <span>文章先頭の絵文字を自動抽出してアイコン化</span>
                        </label>
                    </div>
                </div>

                <!-- Data Preview Table -->
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/80 shadow-md">
                    <h2 class="text-lg font-bold mb-3 text-indigo-300 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i data-lucide="list" class="w-5 h-5"></i> 読み込み中データ一覧 ※スプレッドシートの全カラム・全データをそのまま表示</span>
                    </h2>
                    <div class="max-h-64 overflow-y-auto overflow-x-auto border border-slate-700 rounded-lg">
                        <table id="previewTable" class="w-full text-left text-xs text-slate-300 whitespace-nowrap">
                            <thead id="previewTableHead" class="bg-slate-900/90 text-slate-400 sticky top-0 border-b border-slate-700 z-10"></thead>
                            <tbody id="previewTableBody" class="divide-y divide-slate-700/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // ⚙️ デフォルト設定値（obs.html と共通）
        // ==========================================
        const DEFAULT_CONFIG = {
            width: 800,
            height: 60,
            duration: 10,
            fontFamily: "'Noto Sans JP', sans-serif",
            transition: 'csv',
            headerFontSize: 12,
            mainFontSize: 28,
            mainFontWeight: '500',
            iconInput: '📢',
            iconWidth: 70,
            iconBgColor: '#3b82f6',
            headerTextColor: '#93c5fd',
            mainTextColor: '#ffffff',
            bgColor: '#1e293b',
            bgOpacity: 90,
            autoEmoji: true
        };

        // ページ読み込み時に、保存された設定またはデフォルト値をフォームに反映
        function initFormValues() {
            const saved = localStorage.getItem('obs_ticker_config');
            const config = saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : DEFAULT_CONFIG;

            document.getElementById('tickerWidthInput').value = config.width;
            document.getElementById('tickerHeightInput').value = config.height;
            document.getElementById('displayDuration').value = config.duration;
            document.getElementById('fontFamilySelect').value = config.fontFamily;
            document.getElementById('cfg_transition').value = config.transition;
            document.getElementById('cfg_headerFontSize').value = config.headerFontSize;
            document.getElementById('cfg_mainFontSize').value = config.mainFontSize;
            document.getElementById('cfg_mainFontWeight').value = config.mainFontWeight;
            document.getElementById('cfg_iconInput').value = config.iconInput;
            document.getElementById('cfg_iconWidth').value = config.iconWidth;
            document.getElementById('cfg_iconBgColor').value = config.iconBgColor;
            document.getElementById('cfg_headerTextColor').value = config.headerTextColor;
            document.getElementById('cfg_mainTextColor').value = config.mainTextColor;
            document.getElementById('cfg_bgColor').value = config.bgColor;
            document.getElementById('cfg_bgOpacity').value = config.bgOpacity;
            document.getElementById('cfg_bgOpacityVal').textContent = `${config.bgOpacity}%`;
            document.getElementById('cfg_autoEmoji').checked = config.autoEmoji;
        }

        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdaMfu4w0GvrnNBEDc-eDu05kExD_ZafMHtkvj92WleRoipmDVU832topbMKAl5ErVkQ/exec';
        
        // GitHub Pages上の obs.html をOBSブラウザソース用URLとして指定
        const obsUrl = 'https://aftereffects-ok.github.io/OBS-NewsTicker/obs.html';
        document.getElementById('obsUrlInput').value = obsUrl;
        document.getElementById('obsUrlLink').href = obsUrl;

        document.getElementById('copyUrlBtn').addEventListener('click', () => {
            const input = document.getElementById('obsUrlInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('OBS用URLをコピーしました！');
        });

        let rawCSVHeaders = [];
        let allRecords = [];
        let activeRecords = [];
        const weekDaysJa = ['日', '月', '火', '水', '木', '金', '土'];

        const reloadGasBtn = document.getElementById('reloadGasBtn');
        const csvTextArea = document.getElementById('csvTextArea');
        const applyCsvTextBtn = document.getElementById('applyCsvTextBtn');
        const csvFileInput = document.getElementById('csvFileInput');
        const dropZone = document.getElementById('dropZone');
        const modeFilter = document.getElementById('modeFilter');
        const weekdayFilterCheck = document.getElementById('weekdayFilterCheck');
        const currentWeekdayLabel = document.getElementById('currentWeekdayLabel');
        const displayDuration = document.getElementById('displayDuration');
        const previewTableHead = document.getElementById('previewTableHead');
        const previewTableBody = document.getElementById('previewTableBody');
        const statTotal = document.getElementById('statTotal');
        const statActive = document.getElementById('statActive');

        function parseCSV(text) {
            if (!text || !text.trim()) return [];
            const lines = [];
            let currentRow = [];
            let currentField = '';
            let insideQuote = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (insideQuote && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        insideQuote = !insideQuote;
                    }
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\r' || char === '\n') && !insideQuote) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField.trim());
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
                        lines.push(currentRow);
                    }
                    currentRow = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
                    lines.push(currentRow);
                }
            }

            if (lines.length < 2) return [];

            rawCSVHeaders = lines[0];
            const records = [];

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i];
                if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;

                const record = { _rawRow: row };
                rawCSVHeaders.forEach((h, idx) => {
                    record[h] = row[idx] !== undefined ? row[idx] : '';
                });

                let dayVal = '';
                if (record['配信曜日_AppSheet'] && record['配信曜日_AppSheet'].trim() !== '') {
                    dayVal = record['配信曜日_AppSheet'].trim();
                } else if (record['配信曜日'] && record['配信曜日'].trim() !== '') {
                    dayVal = record['配信曜日'].trim();
                }
                record['配信曜日_AppSheet'] = dayVal;

                const stopVal = (record['配信停止フラグ'] || '').toLowerCase();
                record.isStopped = stopVal === 'true' || stopVal === '1' || stopVal === 'はい' || stopVal === 'yes';

                records.push(record);
            }
            return records;
        }

        function isScheduleMatched(record) {
            const rawDaysStr = ((record['配信曜日_AppSheet'] || '') + ' ' + (record['配信曜日'] || '')).trim();
            if (rawDaysStr.indexOf('不定期') !== -1 || rawDaysStr === '') {
                return true;
            }
            if (!weekdayFilterCheck.checked) return true;

            const now = new Date();
            const todayIndex = now.getDay();
            const todayJa = weekDaysJa[todayIndex];

            const cleanedStr = rawDaysStr
                .replace(/\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, '')
                .replace(/\b\d{1,2}[\/\-]\d{1,2}\b/g, '')
                .replace(/\b\d{1,2}月\d{1,2}日\b/g, '');

            const extractedDays = cleanedStr.match(/[月火水木金土日]/g);
            if (extractedDays && extractedDays.length > 0) {
                return Array.from(new Set(extractedDays)).includes(todayJa);
            }
            return false;
        }

        function filterRecords() {
            const selectedMode = modeFilter.value;
            activeRecords = allRecords.filter(record => {
                if (record.isStopped) return false;
                const modeVal = record['配信モード'] || record['ID配信モード'] || '';
                if (selectedMode !== 'ALL' && modeVal !== selectedMode) {
                    return false;
                }
                return isScheduleMatched(record);
            });

            statTotal.textContent = allRecords.length;
            statActive.textContent = activeRecords.length;
        }

        function updateModeDropdown() {
            const currentSelected = modeFilter.value;
            const modes = new Set();
            allRecords.forEach(r => {
                const m = r['配信モード'] || r['ID配信モード'];
                if (m && m.trim() !== '') modes.add(m.trim());
            });

            modeFilter.innerHTML = '<option value="ALL">すべての配信モード</option>';
            modes.forEach(mode => {
                const opt = document.createElement('option');
                opt.value = mode;
                opt.textContent = mode;
                modeFilter.appendChild(opt);
            });

            if (modes.has(currentSelected)) {
                modeFilter.value = currentSelected;
            } else {
                modeFilter.value = 'ALL';
            }
        }

        function updatePreviewTable() {
            previewTableHead.innerHTML = '';
            previewTableBody.innerHTML = '';

            if (allRecords.length === 0) return;

            const trHead = document.createElement('tr');
            const extraHeaders = ['表示曜日 (抽出)', '特定日 (抽出)', '表示時間 (抽出)'];
            extraHeaders.forEach(hText => {
                const th = document.createElement('th');
                th.className = 'p-2 bg-indigo-950/80 text-indigo-200 border-r border-slate-700';
                th.textContent = hText;
                trHead.appendChild(th);
            });

            rawCSVHeaders.forEach(h => {
                const th = document.createElement('th');
                th.className = 'p-2 border-r border-slate-700/50';
                th.textContent = h;
                trHead.appendChild(th);
            });
            previewTableHead.appendChild(trHead);

            allRecords.forEach((record, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-slate-800/40 hover:bg-slate-700/50' : 'bg-slate-900/40 hover:bg-slate-700/50';

                const rawDaysStr = ((record['配信曜日_AppSheet'] || '') + ' ' + (record['配信曜日'] || '')).trim();
                let daysText = '-';
                if (rawDaysStr.indexOf('不定期') !== -1 || rawDaysStr === '') {
                    daysText = '月, 火, 水, 木, 金, 土, 日';
                } else {
                    const cleanedStr = rawDaysStr
                        .replace(/\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, '')
                        .replace(/\b\d{1,2}[\/\-]\d{1,2}\b/g, '')
                        .replace(/\b\d{1,2}月\d{1,2}日\b/g, '');

                    const daysMatch = cleanedStr.match(/[月火水木金土日]/g);
                    if (daysMatch) {
                        const uniqueDays = Array.from(new Set(daysMatch));
                        const order = ['月', '火', '水', '木', '金', '土', '日'];
                        uniqueDays.sort((a, b) => order.indexOf(a) - order.indexOf(b));
                        daysText = uniqueDays.join(', ');
                    }
                }

                let dateText = '-';
                if (rawDaysStr.indexOf('不定期') === -1) {
                    const dateMatch = rawDaysStr.match(/\b(?:\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|\d{1,2}[\/\-]\d{1,2}|\d{1,2}月\d{1,2}日)\b/);
                    if (dateMatch) dateText = dateMatch[0];
                }

                const timeText = record['表示時間'] ? `${record['表示時間']}秒` : `${displayDuration.value}秒 (デフォルト)`;

                [daysText, dateText, timeText].forEach(text => {
                    const td = document.createElement('td');
                    td.className = 'p-2 font-semibold text-amber-300 border-r border-slate-700/80 bg-indigo-950/30';
                    td.textContent = text;
                    tr.appendChild(td);
                });

                rawCSVHeaders.forEach(h => {
                    const td = document.createElement('td');
                    td.className = 'p-2 border-r border-slate-700/50 max-w-xs truncate';
                    td.textContent = record[h] !== undefined ? record[h] : '';
                    td.title = record[h] !== undefined ? record[h] : '';
                    tr.appendChild(td);
                });

                previewTableBody.appendChild(tr);
            });
        }

        function loadCSV(csvText) {
            allRecords = parseCSV(csvText);
            updateModeDropdown();
            updatePreviewTable();
            filterRecords();
        }

        function fetchFromGAS() {
            fetch(GAS_WEB_APP_URL)
                .then(response => response.text())
                .then(csvText => {
                    if (csvText && csvText.trim().length > 0) {
                        csvTextArea.value = csvText;
                        loadCSV(csvText);
                    }
                })
                .catch(err => {
                    console.error('GASからのデータ取得に失敗しました:', err);
                });
        }

        function initCurrentDateLabel() {
            const todayJa = weekDaysJa[new Date().getDay()];
            currentWeekdayLabel.textContent = `${todayJa}曜日`;
        }

        window.onload = function() {
            initCurrentDateLabel();
            lucide.createIcons();
            
            // ⚙️ デフォルト設定値または保存された設定をフォームに反映
            initFormValues();

            fetchFromGAS();

            reloadGasBtn.addEventListener('click', fetchFromGAS);

            applyCsvTextBtn.addEventListener('click', () => {
                loadCSV(csvTextArea.value);
            });

            dropZone.addEventListener('click', () => csvFileInput.click());
            csvFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    csvTextArea.value = event.target.result;
                    loadCSV(event.target.result);
                };
                reader.readAsText(file);
            });

            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
            dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-indigo-500'); });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-indigo-500');
                const file = e.dataTransfer.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    csvTextArea.value = event.target.result;
                    loadCSV(event.target.result);
                };
                reader.readAsText(file);
            });

            modeFilter.addEventListener('change', filterRecords);
            weekdayFilterCheck.addEventListener('change', filterRecords);
        };

        // 設定内容をローカルストレージに保存し、obs.htmlへリアルタイム通知する
        function saveConfig() {
            const config = {
                width: document.getElementById('tickerWidthInput').value,
                height: document.getElementById('tickerHeightInput').value,
                duration: document.getElementById('displayDuration').value,
                fontFamily: document.getElementById('fontFamilySelect').value,
                transition: document.getElementById('cfg_transition').value,
                headerFontSize: document.getElementById('cfg_headerFontSize').value,
                mainFontSize: document.getElementById('cfg_mainFontSize').value,
                mainFontWeight: document.getElementById('cfg_mainFontWeight').value,
                iconInput: document.getElementById('cfg_iconInput').value,
                iconWidth: document.getElementById('cfg_iconWidth').value,
                iconBgColor: document.getElementById('cfg_iconBgColor').value,
                headerTextColor: document.getElementById('cfg_headerTextColor').value,
                mainTextColor: document.getElementById('cfg_mainTextColor').value,
                bgColor: document.getElementById('cfg_bgColor').value,
                bgOpacity: document.getElementById('cfg_bgOpacity').value,
                autoEmoji: document.getElementById('cfg_autoEmoji').checked
            };
            localStorage.setItem('obs_ticker_config', JSON.stringify(config));
        }

        // イベントリスナーに追加
        const allInputs = [
            tickerWidthInput, tickerHeightInput, displayDuration, fontFamilySelect,
            cfg_transition, cfg_headerFontSize, cfg_mainFontSize, cfg_mainFontWeight, cfg_iconInput,
            cfg_iconWidth, cfg_iconBgColor, cfg_headerTextColor, cfg_mainTextColor,
            cfg_bgColor, cfg_bgOpacity, cfg_autoEmoji
        ];

        allInputs.forEach(input => {
            if (input) {
                input.addEventListener('input', saveConfig);
                input.addEventListener('change', saveConfig);
            }
        });
    </script>
</body>
</html>
