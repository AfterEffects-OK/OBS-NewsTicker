<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS ライブプレビュー出力</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: transparent !important;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .ticker-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            pointer-events: none;
            padding-bottom: 2rem;
            background: transparent !important;
        }
        .ticker-box {
            overflow: hidden;
            position: relative;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
            box-sizing: border-box;
            flex-shrink: 0;
            padding: 0;
            display: flex;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.9);
            width: 1300px;
            height: 80px;
            border-radius: 0.75rem;
        }
        .ticker-content {
            white-space: nowrap;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            box-sizing: border-box;
            gap: 0;
            position: relative;
            overflow: hidden;
        }
        .ticker-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            height: 100%;
            aspect-ratio: 1 / 1;
            padding: 4px;
            box-sizing: border-box;
            z-index: 10;
            overflow: hidden;
        }
        .ticker-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .ticker-body-container {
            padding: 0 0.8rem;
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }
        .ticker-header-text {
            font-size: 24px;
            opacity: 0.85;
            color: #fde047;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
        }
        .ticker-main-text {
            font-size: 45px;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            display: inline-block;
            transition: transform 0.1s linear;
            will-change: transform;
            overflow: visible;
            text-overflow: clip;
            width: max-content;
        }
        .ticker-main-text.is-scrolling {
            overflow: visible !important;
            text-overflow: clip !important;
            white-space: nowrap !important;
        }
        /* Transition Classes */
        .slide-up-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .slide-up-out-before { transform: translate3d(0, 100%, 0); opacity: 0; }
        .slide-up-out-after { transform: translate3d(0, -100%, 0); opacity: 0; }
        .slide-down-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .slide-down-out-before { transform: translate3d(0, -100%, 0); opacity: 0; }
        .slide-down-out-after { transform: translate3d(0, 100%, 0); opacity: 0; }
        .slide-left-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .slide-left-out-before { transform: translate3d(100%, 0, 0); opacity: 0; }
        .slide-left-out-after { transform: translate3d(-100%, 0, 0); opacity: 0; }
        .slide-right-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .slide-right-out-before { transform: translate3d(-100%, 0, 0); opacity: 0; }
        .slide-right-out-after { transform: translate3d(100%, 0, 0); opacity: 0; }
        .fade-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .fade-out { transform: translate3d(0, 0, 0); opacity: 0; }
    </style>
</head>
<body class="h-screen w-screen relative bg-transparent">
    <div class="ticker-wrapper">
        <div id="tickerContainer" class="ticker-box rounded-xl">
            <span id="tickerIcon" class="ticker-badge"></span>
            <div id="tickerContent" class="ticker-content font-bold text-white">
                <div id="tickerBodyContainer" class="ticker-body-container slide-up-in">
                    <div id="tickerHeader" class="ticker-header-text"></div>
                    <div id="tickerMain" class="ticker-main-text">データを読み込み中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_CONFIG = {
            width: 1300,
            height: 80,
            duration: 10,
            fontFamily: "'M PLUS Rounded 1c', sans-serif",
            transition: 'swipe-up',
            headerFontSize: 24,
            mainFontSize: 45,
            mainFontWeight: '500',
            iconInput: 'https://raw.githubusercontent.com/AfterEffects-OK/PortalSite/refs/heads/main/KagisenKun-icon.png',
            iconWidth: 70,
            iconBgColor: '#0f172a',
            headerTextColor: '#fde047',
            mainTextColor: '#ffffff',
            bgColor: '#0f172a',
            bgOpacity: 90,
            autoEmoji: true,
            selectedMode: 'ALL'
        };

        let currentConfig = { ...DEFAULT_CONFIG };
        let allRecords = [];
        let activeRecords = [];
        let currentIndex = 0;
        let animationTimer = null;
        let scrollTimer = null;
        let isPlaying = false;

        const weekDaysJa = ['日', '月', '火', '水', '木', '金', '土'];
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdaMfu4w0GvrnNBEDc-eDu05kExD_ZafMHtkvj92WleRoipmDVU832topbMKAl5ErVkQ/exec';

        function hexToRgba(hex, opacityPercent) {
            const num = parseInt((hex || '#0f172a').replace('#', ''), 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${opacityPercent / 100})`;
        }

        function loadConfig() {
            const saved = localStorage.getItem('obs_ticker_config');
            if (saved) {
                try {
                    currentConfig = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
                } catch(e) {}
            } else {
                currentConfig = { ...DEFAULT_CONFIG };
            }
            applyConfigToDOM();
            if (allRecords.length > 0) {
                processRecords(allRecords);
            }
        }

        function applyConfigToDOM() {
            const container = document.getElementById('tickerContainer');
            const content = document.getElementById('tickerContent');
            const header = document.getElementById('tickerHeader');
            const main = document.getElementById('tickerMain');
            const icon = document.getElementById('tickerIcon');

            content.style.fontFamily = currentConfig.fontFamily;
            header.style.fontSize = `${currentConfig.headerFontSize}px`;
            header.style.color = currentConfig.headerTextColor;
            main.style.fontSize = `${currentConfig.mainFontSize}px`;
            main.style.fontWeight = currentConfig.mainFontWeight;
            main.style.color = currentConfig.mainTextColor;
            container.style.backgroundColor = hexToRgba(currentConfig.bgColor, currentConfig.bgOpacity);
            icon.style.backgroundColor = currentConfig.iconBgColor;
            icon.style.width = `${currentConfig.iconWidth}px`;
            container.style.width = `${currentConfig.width}px`;
            container.style.height = `${currentConfig.height}px`;
        }

        let lastConfigStr = localStorage.getItem('obs_ticker_config') || '';
        setInterval(() => {
            const currentStr = localStorage.getItem('obs_ticker_config') || '';
            if (currentStr !== lastConfigStr) {
                lastConfigStr = currentStr;
                loadConfig();
            }
        }, 500);

        function renderIconElement(targetEl, iconValue) {
            targetEl.innerHTML = '';
            if (!iconValue) return;
            if (iconValue.startsWith('http://') || iconValue.startsWith('https://')) {
                const img = document.createElement('img');
                img.src = iconValue;
                img.alt = 'Icon';
                img.onerror = () => {
                    targetEl.textContent = '📢';
                };
                targetEl.appendChild(img);
            } else {
                targetEl.textContent = iconValue;
            }
        }

        function parseCSV(text) {
            if (!text || !text.trim()) return [];
            const lines = [];
            let currentRow = [];
            let currentField = '';
            let insideQuote = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                
                if (char === '"') {
                    if (insideQuote && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        insideQuote = !insideQuote;
                    }
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\r' || char === '\n') && !insideQuote) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField.trim());
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
                        lines.push(currentRow);
                    }
                    currentRow = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            
            // 最後の行（改行で終わっていない場合など）を確実にプッシュする修正
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
                    lines.push(currentRow);
                }
            }
            
            if (lines.length < 2) return [];
            
            const headers = lines[0];
            const records = [];
            
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i];
                if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;
                
                const record = {};
                headers.forEach((h, idx) => {
                    record[h] = row[idx] !== undefined ? row[idx] : '';
                });
                
                let headerVal = '';
                if (record['件名'] !== undefined && record['件名'].trim() !== '') {
                    headerVal = record['件名'].trim();
                }
                record['件名'] = headerVal;
                
                let dayVal = (record['配信曜日_AppSheet'] || record['配信曜日'] || '').trim();
                record['配信曜日_AppSheet'] = dayVal;
                
                const stopVal = (record['配信停止フラグ'] || '').toLowerCase();
                record.isStopped = stopVal === 'true' || stopVal === '1' || stopVal === 'はい' || stopVal === 'yes';
                
                records.push(record);
            }
            
            return records;
        }

        function animateTicker(record, onComplete) {
            const tickerHeader = document.getElementById('tickerHeader');
            const tickerMain = document.getElementById('tickerMain');
            const tickerIcon = document.getElementById('tickerIcon');
            const bodyContainer = document.getElementById('tickerBodyContainer');

            if (!record) {
                tickerHeader.style.display = 'none';
                tickerMain.textContent = '表示可能なニュース項目がありません';
                renderIconElement(tickerIcon, 'ℹ️');
                if (onComplete) onComplete(10);
                return;
            }

            clearTimeout(scrollTimer);
            tickerMain.classList.remove('is-scrolling');
            tickerMain.style.transition = 'none';
            tickerMain.style.transform = 'translateX(0px)';

            let trans = currentConfig.transition;
            if (trans === 'csv') {
                trans = (record['トランジション'] || 'swipe-up').toLowerCase();
            }

            let displayIcon = currentConfig.iconInput || 'https://raw.githubusercontent.com/AfterEffects-OK/PortalSite/refs/heads/main/KagisenKun-icon.png';
            let displayText = record['配信内容'] || '';
            let headerText = record['件名'] || '';

            if (currentConfig.autoEmoji && displayText) {
                const emojiMatch = displayText.match(/^([\p{Extended_Pictographic}\u2600-\u27BF])/u);
                if (emojiMatch) {
                    displayIcon = emojiMatch[1];
                    displayText = displayText.replace(/^[\p{Extended_Pictographic}\u2600-\u27BF]+\s*/u, '');
                }
            }

            renderIconElement(tickerIcon, displayIcon);

            if (headerText === '') {
                tickerHeader.style.display = 'none';
            } else {
                tickerHeader.textContent = headerText;
                tickerHeader.style.display = 'block';
            }

            let outClass = 'slide-up-out-after';
            let inClass = 'slide-up-in';
            let prepClass = 'slide-up-out-before';

            if (trans.includes('down')) {
                outClass = 'slide-down-out-after';
                inClass = 'slide-down-in';
                prepClass = 'slide-down-out-before';
            } else if (trans.includes('left')) {
                outClass = 'slide-left-out-after';
                inClass = 'slide-left-in';
                prepClass = 'slide-left-out-before';
            } else if (trans.includes('right')) {
                outClass = 'slide-right-out-after';
                inClass = 'slide-right-in';
                prepClass = 'slide-right-out-before';
            } else if (trans.includes('fade')) {
                outClass = 'fade-out';
                inClass = 'fade-in';
                prepClass = 'fade-out';
            }

            bodyContainer.className = `ticker-body-container ${outClass}`;

            setTimeout(() => {
                tickerMain.textContent = displayText;
                bodyContainer.className = `ticker-body-container ${prepClass}`;

                requestAnimationFrame(() => {
                    bodyContainer.className = `ticker-body-container ${inClass}`;

                    let defaultDurationSec = parseInt(currentConfig.duration) || 10;
                    if (record['表示時間'] && !isNaN(parseInt(record['表示時間']))) {
                        defaultDurationSec = parseInt(record['表示時間']);
                    }

                    let totalDurationMs = defaultDurationSec * 1000;

                    setTimeout(() => {
                        tickerMain.classList.add('is-scrolling');
                        const textWidth = Math.max(tickerMain.scrollWidth, tickerMain.getBoundingClientRect().width);
                        const containerWidth = bodyContainer.clientWidth;

                        if (textWidth > containerWidth + 2) {
                            const scrollDistance = textWidth - containerWidth + 20;
                            const speed = 50;
                            const scrollDurationSec = scrollDistance / speed;
                            const scrollDurationMs = scrollDurationSec * 1000;
                            const requiredTimeMs = 1500 + scrollDurationMs + 1500;

                            if (requiredTimeMs > totalDurationMs) {
                                totalDurationMs = requiredTimeMs;
                            }

                            scrollTimer = setTimeout(() => {
                                tickerMain.style.transition = `transform ${scrollDurationSec.toFixed(2)}s linear`;
                                tickerMain.style.transform = `translateX(-${scrollDistance}px)`;
                            }, 1500);
                        }

                        if (onComplete) {
                            onComplete(totalDurationMs / 1000);
                        }
                    }, 50);
                });
            }, 300);
        }

        function playNextTicker() {
            if (activeRecords.length === 0) {
                setTimeout(fetchDataAndPlay, 5000);
                return;
            }
            if (currentIndex >= activeRecords.length) {
                currentIndex = 0;
            }

            const currentRecord = activeRecords[currentIndex++];
            animateTicker(currentRecord, (durationSec) => {
                clearTimeout(animationTimer);
                animationTimer = setTimeout(playNextTicker, durationSec * 1000);
            });
        }

        function processRecords(rawRecords) {
            const todayJa = weekDaysJa[new Date().getDay()];
            const selectedMode = (currentConfig.selectedMode || 'ALL').trim();

            activeRecords = rawRecords.filter(record => {
                if (record.isStopped) return false;

                let modeVal = (record['配信モード'] || '').trim();
                if (!modeVal) {
                    for (let key in record) {
                        if (key.includes('配信モード')) {
                            const val = (record[key] || '').trim();
                            if (val !== '') {
                                modeVal = val;
                                break;
                            }
                        }
                    }
                }

                if (selectedMode !== 'ALL' && modeVal !== selectedMode) {
                    return false;
                }

                const days = record['配信曜日_AppSheet'] || record['配信曜日'] || '';
                if (days.indexOf('不定期') !== -1 || days === '') return true;
                return days.includes(todayJa);
            });

            if (currentIndex >= activeRecords.length) {
                currentIndex = 0;
            }

            if (!isPlaying && activeRecords.length > 0) {
                isPlaying = true;
                playNextTicker();
            }
        }

        function fetchDataAndPlay() {
            const cacheBustedUrl = `${GAS_WEB_APP_URL}?t=${new Date().getTime()}`;
            fetch(cacheBustedUrl)
                .then(res => res.text())
                .then(csv => {
                    allRecords = parseCSV(csv);
                    processRecords(allRecords);
                })
                .catch(err => {
                    console.error('データ取得エラー:', err);
                    setTimeout(fetchDataAndPlay, 5000);
                });
        }

        window.onload = function() {
            loadConfig();
            fetchDataAndPlay();
            // 3分ごとに自動更新
            setInterval(fetchDataAndPlay, 3 * 60 * 1000);
        };
    </script>
</body>
</html>
