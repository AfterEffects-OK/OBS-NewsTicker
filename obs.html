<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS ライブプレビュー出力</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: transparent !important;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .ticker-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background: transparent !important;
            padding-bottom: 2rem;
        }
        .ticker-box {
            overflow: hidden;
            position: relative;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background-color: rgba(30, 41, 59, 0.9);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            width: 800px;
            height: 60px;
            border-radius: 0.75rem;
        }
        .ticker-content {
            white-space: nowrap;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .ticker-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            height: 100%;
            width: 70px;
            padding: 0 0.4rem;
            font-size: 1.1em;
            background-color: #3b82f6;
            z-index: 10;
        }
        .ticker-body-container {
            padding: 0 0.5rem;
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ticker-header-text {
            font-size: 12px;
            opacity: 0.85;
            color: #93c5fd;
            font-weight: 700;
            display: none;
        }
        .ticker-main-text {
            font-size: 28px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            display: inline-block;
            transition: transform 0.1s linear;
            width: max-content;
        }
        .slide-up-in { transform: translate3d(0, 0, 0); opacity: 1; }
        .slide-up-out-before { transform: translate3d(0, 100%, 0); opacity: 0; }
        .slide-up-out-after { transform: translate3d(0, -100%, 0); opacity: 0; }
    </style>
</head>
<body class="h-screen w-screen relative bg-transparent">
    <div class="ticker-wrapper">
        <div id="tickerContainer" class="ticker-box">
            <span id="tickerIcon" class="ticker-badge">📢</span>
            <div class="ticker-content font-bold text-white">
                <div id="tickerBodyContainer" class="ticker-body-container slide-up-in">
                    <div id="tickerHeader" class="ticker-header-text"></div>
                    <div id="tickerMain" class="ticker-main-text">読み込み中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdaMfu4w0GvrnNBEDc-eDu05kExD_ZafMHtkvj92WleRoipmDVU832topbMKAl5ErVkQ/exec';
        let allRecords = [];
        let activeRecords = [];
        let currentIndex = 0;

        function parseCSV(text) {
            if (!text || !text.trim()) return [];
            const lines = [];
            let currentRow = [];
            let currentField = '';
            let insideQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (char === '"') {
                    if (insideQuote && nextChar === '"') { currentField += '"'; i++; }
                    else { insideQuote = !insideQuote; }
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(currentField.trim()); currentField = '';
                } else if ((char === '\r' || char === '\n') && !insideQuote) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField.trim());
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) lines.push(currentRow);
                    currentRow = []; currentField = '';
                } else { currentField += char; }
            }
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) lines.push(currentRow);
            }
            if (lines.length < 2) return [];
            const headers = lines[0];
            const records = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i];
                if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;
                const record = {};
                headers.forEach((h, idx) => { record[h] = row[idx] !== undefined ? row[idx] : ''; });
                
                let headerVal = '';
                if (record['件名'] !== undefined && record['件名'].trim() !== '') headerVal = record['件名'].trim();
                else if (headers[10] && record[headers[10]] !== undefined && record[headers[10]].trim() !== '') headerVal = record[headers[10]].trim();
                record['件名'] = headerVal;

                let dayVal = (record['配信曜日_AppSheet'] || record['配信曜日'] || '').trim();
                record['配信曜日_AppSheet'] = dayVal;

                const stopVal = (record['配信停止フラグ'] || '').toLowerCase();
                record.isStopped = stopVal === 'true' || stopVal === '1' || stopVal === 'はい' || stopVal === 'yes';
                records.push(record);
            }
            return records;
        }

        function animateTicker(record, onComplete) {
            if (!record) {
                if (onComplete) onComplete(10);
                return;
            }
            const tickerHeader = document.getElementById('tickerHeader');
            const tickerMain = document.getElementById('tickerMain');
            const bodyContainer = document.getElementById('tickerBodyContainer');

            tickerMain.style.transition = 'none';
            tickerMain.style.transform = 'translateX(0px)';

            let headerText = record['件名'] || '';
            if (headerText === '') {
                tickerHeader.style.display = 'none';
            } else {
                tickerHeader.textContent = headerText;
                tickerHeader.style.display = 'block';
            }
            tickerMain.textContent = record['配信内容'] || '';

            bodyContainer.className = 'ticker-body-container slide-up-out-before';
            setTimeout(() => {
                bodyContainer.className = 'ticker-body-container slide-up-in';
                let durationSec = parseInt(record['表示時間']) || 10;
                let totalMs = durationSec * 1000;

                setTimeout(() => {
                    const textWidth = Math.max(tickerMain.scrollWidth, tickerMain.getBoundingClientRect().width);
                    const containerWidth = bodyContainer.clientWidth;
                    if (textWidth > containerWidth + 2) {
                        const dist = textWidth - containerWidth + 20;
                        const scrollSec = dist / 50;
                        const reqMs = 1500 + (scrollSec * 1000) + 1500;
                        if (reqMs > totalMs) totalMs = reqMs;
                        setTimeout(() => {
                            tickerMain.style.transition = `transform ${scrollSec.toFixed(2)}s linear`;
                            tickerMain.style.transform = `translateX(-${dist}px)`;
                        }, 1500);
                    }
                    if (onComplete) onComplete(totalMs / 1000);
                }, 50);
            }, 300);
        }

        function playLoop() {
            if (activeRecords.length === 0) {
                setTimeout(fetchData, 5000);
                return;
            }
            if (currentIndex >= activeRecords.length) currentIndex = 0;
            const rec = activeRecords[currentIndex++];
            animateTicker(rec, (sec) => {
                setTimeout(playLoop, sec * 1000);
            });
        }

        function fetchData() {
            fetch(GAS_WEB_APP_URL)
                .then(res => res.text())
                .then(csv => {
                    allRecords = parseCSV(csv);
                    const todayJa = ['日', '月', '火', '水', '木', '金', '土'][new Date().getDay()];
                    activeRecords = allRecords.filter(r => {
                        if (r.isStopped) return false;
                        const days = r['配信曜日_AppSheet'] || '';
                        if (days.indexOf('不定期') !== -1 || days === '') return true;
                        return days.includes(todayJa);
                    });
                    if (activeRecords.length === 0) activeRecords = allRecords.filter(r => !r.isStopped);
                    playLoop();
                })
                .catch(() => {
                    setTimeout(fetchData, 5000);
                });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
